name: Update Package

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - 'veracrypt.nuspec'
      - 'tools/**'
      - 'update.ps1'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veracrypt-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for updates
        id: check
        if: github.event_name != 'push'
        run: .\update.ps1

      - name: Pack
        if: github.event_name == 'push' || steps.check.outputs.updated == 'true'
        run: choco pack veracrypt.nuspec

      - name: Push
        if: github.event_name == 'push' || steps.check.outputs.updated == 'true'
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          choco apikey add --source "https://push.chocolatey.org/" --api-key "$env:CHOCO_API_KEY"
          $package = Get-ChildItem -Filter *.nupkg | Select-Object -First 1
          if (-not $package) {
            throw "No .nupkg file found to push."
          }
          choco push $package.FullName --source "https://push.chocolatey.org/"

      - name: Commit and push changes
        if: steps.check.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add veracrypt.nuspec tools/chocolateyInstall.ps1
          git commit -m "Update VeraCrypt to $env:VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to commit package updates."
          }
          git push
