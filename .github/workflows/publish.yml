name: Update Package

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AU module
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name AU -RequiredVersion 2022.10.24 -Force

      - name: Check for updates
        id: check
        run: |
          try {
            $release = Invoke-RestMethod -Method Get -Uri 'https://api.github.com/repos/veracrypt/VeraCrypt/releases/latest'
            $latestVersion = [Version] ($release.tag_name -replace '^VeraCrypt_', '')
          } catch {
            Write-Error "Failed to fetch version information from the VeraCrypt GitHub release: $_"
            exit 1
          }

          try {
            $nuspec = [xml](Get-Content veracrypt.nuspec -ErrorAction Stop)
            $currentVersion = [Version] $nuspec.package.metadata.version
          } catch {
            Write-Error "Failed to read or parse veracrypt.nuspec: $_"
            exit 1
          }

          if ($latestVersion -gt $currentVersion) {
            Write-Host "New version available: $latestVersion (current: $currentVersion)"
            "updated=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "version=$latestVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "Package is up to date at version $currentVersion"
            "updated=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Run AU update
        if: steps.check.outputs.updated == 'true'
        run: |
          Import-Module au
          .\update.ps1

      - name: Build package
        if: steps.check.outputs.updated == 'true'
        run: choco pack veracrypt.nuspec

      - name: Push package to Chocolatey
        if: steps.check.outputs.updated == 'true'
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $nupkg = Get-ChildItem -Path *.nupkg | Select-Object -First 1
          if (-not $nupkg) {
            Write-Error "No .nupkg file found in the repository root"
            exit 1
          }
          choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY

      - name: Commit and push changes
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add veracrypt.nuspec tools/chocolateyInstall.ps1
          git commit -m "Update VeraCrypt to ${{ steps.check.outputs.version }}"
          git push
